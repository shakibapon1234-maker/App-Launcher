<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonS)" stroke-width="4" opacity="0.4" stroke-dasharray="12 8" />

  <!-- Modern Dynamic 'S' Symbol for Shakib Studio Hub -->
  <path d="M 330 150 C 310 120 270 110 230 120 C 180 132 155 170 160 215 C 165 255 200 280 260 295 C 330 312 355 340 350 380 C 342 430 290 460 230 455 C 180 450 145 425 125 390" 
        fill="none" 
        stroke="url(#neonS)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Floating 3D Sparkles -->
  <polygon points="380,120 390,145 415,155 390,165 380,190 370,165 345,155 370,145" fill="#f59e0b" filter="url(#glow)" />
  <polygon points="120,330 128,348 146,356 128,364 120,382 112,364 94,356 112,348" fill="#38bdf8" filter="url(#glow)" />
</svg>
