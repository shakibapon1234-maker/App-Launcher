<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shakib Studio Hub — Application Launcher</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="hub-container">
    <!-- Header -->
    <header class="hub-header">
      <div class="header-brand">
        <div class="brand-logo">
          <img src="logo.svg" alt="Shakib Studio Hub" class="brand-logo-img" />
        </div>
        <div class="brand-text">
          <h1>Shakib Studio Hub</h1>
          <p>সকল অ্যাপ ও ওয়েবসাইটের সেন্ট্রাল কন্ট্রোল সেন্টার</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="appSearchInput" placeholder="অ্যাপ বা বুকমার্ক খুঁজুন..." />
        </div>
        <button class="btn-refresh" id="refreshBtn" title="রিফ্রেশ">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </header>

    <!-- Filter Tabs -->
    <nav class="hub-nav" id="mainNav">
      <button class="nav-tab active" data-filter="all" data-section="apps">
        <i class="fa-solid fa-border-all"></i> সকল অ্যাপ
      </button>
      <button class="nav-tab" data-filter="creative" data-section="apps">
        <i class="fa-solid fa-wand-magic-sparkles"></i> ক্রিয়েটিভ
      </button>
      <button class="nav-tab" data-filter="document" data-section="apps">
        <i class="fa-solid fa-file-pdf"></i> পিডিএফ
      </button>
      <button class="nav-tab" data-filter="business" data-section="apps">
        <i class="fa-solid fa-store"></i> বিজনেস
      </button>
      <button class="nav-tab" data-filter="education" data-section="apps">
        <i class="fa-solid fa-graduation-cap"></i> একাডেমি
      </button>
      <button class="nav-tab" data-filter="finance" data-section="apps">
        <i class="fa-solid fa-hand-holding-dollar"></i> ফাইন্যান্স
      </button>
      <!-- Bookmark Tab -->
      <button class="nav-tab nav-tab-bookmark" data-section="bookmarks" style="margin-left:auto; background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.25);">
        <i class="fa-solid fa-bookmark"></i> বুকমার্কস
        <span id="bookmarkCount" class="bm-count" style="display:none;"></span>
      </button>
    </nav>

    <!-- Apps Section -->
    <main class="apps-grid" id="appsGrid">
      <div class="loading-state">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <span>অ্যাপ্লিকেশন লোড হচ্ছে...</span>
      </div>
    </main>

    <!-- Bookmarks Section -->
    <div class="bookmarks-panel" id="bookmarksPanel">
      <div class="bookmark-toolbar">
        <div class="bookmark-search-box">
          <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
          <input type="text" id="bookmarkSearch" placeholder="বুকমার্ক খুঁজুন..." />
        </div>
        <button class="btn-add-bookmark" id="openAddBookmarkBtn">
          <i class="fa-solid fa-plus"></i> বুকমার্ক যুক্ত করুন
        </button>
      </div>
      <div class="bookmarks-grid" id="bookmarksGrid">
        <div class="empty-bookmarks">
          <i class="fa-solid fa-bookmark"></i>
          <span>কোনো বুকমার্ক নেই। উপরের বাটন দিয়ে যোগ করুন।</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="hub-footer">
      <div class="footer-left">
        <span class="status-indicator live"></span>
        <span>Shakib Studio Hub · <strong>Port 4500</strong></span>
      </div>
      <div class="footer-right">
        <span>© Shakib Studio Hub</span>
      </div>
    </footer>
  </div>

  <!-- Add / Edit Bookmark Modal -->
  <div class="modal-overlay" id="bookmarkModal">
    <div class="modal-box">
      <div class="modal-title">
        <span id="modalTitle">🔖 বুকমার্ক যুক্ত করুন</span>
        <button class="modal-close" id="closeModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-field">
        <label>শিরোনাম (Title)</label>
        <input type="text" id="bmTitle" placeholder="যেমন: Warisha Fashion Website" />
      </div>
      <div class="modal-field">
        <label>URL / লিঙ্ক</label>
        <input type="url" id="bmUrl" placeholder="https://example.com" />
      </div>
      <div class="modal-field">
        <label>ক্যাটাগরি / ধরন</label>
        <select id="bmCategory">
          <option value="website">🌐 সাধারণ ওয়েবসাইট</option>
          <option value="wordpress">📝 WordPress সাইট</option>
          <option value="admin">🔧 Admin Panel</option>
          <option value="social">📱 সোশ্যাল মিডিয়া</option>
          <option value="tool">🛠️ ডেভ টুল</option>
          <option value="finance">💰 ফাইন্যান্স ও পেমেন্ট</option>
          <option value="other">📌 অন্যান্য</option>
        </select>
      </div>
      <div class="modal-field">
        <label>নোট (ঐচ্ছিক)</label>
        <input type="text" id="bmNote" placeholder="যেমন: ব্যবসার মেইন সাইট" />
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" id="cancelModal">বাতিল</button>
        <button class="btn-modal-save" id="saveBookmark">সংরক্ষণ করুন</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <style>
    .bm-count {
      background: #f59e0b;
      color: #0b0d13;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 20px;
      margin-left: 4px;
    }
  </style>

  <script src="app.js"></script>
</body>
</html>
